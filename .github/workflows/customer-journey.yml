name: Customer journey check

on:
  push:
    branches: ['fix/customer-journey-2026-10-07']
    paths:
      - '.github/workflows/customer-journey.yml'
      - 'scripts/customer_journey_browser.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-journey-${{ github.ref }}
  cancel-in-progress: false

jobs:
  storefront:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned browser tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Anonymous desktop and mobile customer journey
        run: python scripts/customer_journey_browser.py --cart
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: customer-journey-evidence
          path: test-results/customer-journey/
          retention-days: 7
