function firstLinkedProductImage(choice, productsById) {

}

function replaceLinkedProductImages(productsById, productId, expectedSku, images) {

  return true;

      for(const f of families)for(const p of f.products){p.linked_product_id='offline:'+p.sku;if(!linkedProducts.has(p.linked_product_id))linkedProducts.set(p.linked_product_id,{id:p.linked_product_id,sku:p.sku,images:[]});}
// Conditional product axes are visible only when their parent choice allows them.

function axisActive(axis, options, family) {
  if (axis.dependsOn) {
    const candidates = family.products.filter(product => axis.dependsOn.every(key => product.options[key] === options[key]));
    const values = new Set(candidates.map(product => product.options[axis.key]).filter(value => axis.values.includes(value)));

}
function matchingChoices(family, options) {
  return family.products.filter(product => family.axes.every(axis => {
    if (!axisActive(axis, options, family)) return true;
    if ((axis.when || axis.dependsOn) && !axis.values.includes(options[axis.key])) return true;

      }
      function closeDecors(focus=false){for(const c of controls)if(c.dropdown){const was=c.dropdown.open;c.dropdown.open=false;if(was&&focus)c.summary.focus();}}
      function build(){
        holder.replaceChildren();controls=[];drain=null;
        for(const axis of family.axes){
          if(axis.values.length<2)continue;
          const group=node('section','bc-group'),label=node('div','bc-label');
          label.append(document.createTextNode(axis.label+': '));const chosen=node('strong');label.append(chosen);group.append(label);
          if(axis.kind==='select'){
            const select=node('select','bc-select cursor-interaction'),entries=[];select.setAttribute('aria-label',axis.label);
            for(const value of axis.values){const option=node('option',null,displayValue(axis,value));option.value=value;select.append(option);entries.push({button:option,value});}
            select.addEventListener('change',()=>{if(!choose(axis.key,select.value))update();});group.append(select);
            if(family.category==='Glas'&&axis.key==='width')group.append(node('p','bc-small','Catalogusmaat; controleer de plaatsingsmaat in de technische tekening.'));
            holder.append(group);controls.push({axis,group,chosen,entries,select});continue;
          }
          const swatch=['metal','texture','decorchips'].includes(axis.kind),dropdown=axis.kind==='dropdown'?node('details','bc-decors'):null;
          let summary=null,currentImage=null,currentName=null;
          const list=node('div',dropdown?'bc-decor-list':swatch?'bc-swatches':axis.kind==='plans'?'bc-plans':['productphotos','finishphotos'].includes(axis.kind)?'bc-config-options':axis.kind==='handlephotos'?'bc-handles':'bc-values');
          list.setAttribute('role','group');list.setAttribute('aria-label',axis.label);
          if(dropdown){
            summary=node('summary','cursor-interaction');summary.setAttribute('aria-label','Kies kleur of decor');
            const row=node('span','bc-decor-current');currentImage=node('img');currentImage.alt='';currentImage.width=36;currentImage.height=36;
            currentName=node('span');row.append(currentImage,currentName);summary.append(row);dropdown.append(summary,list);group.append(dropdown);
          }else group.append(list);
          const entries=[];
          for(const value of axis.values){
            const b=node('button',(dropdown?'bc-decor-item':swatch?'bc-swatch':axis.kind==='plans'?'bc-choice bc-plan-choice':['productphotos','finishphotos'].includes(axis.kind)?'bc-choice bc-config-choice':axis.kind==='handlephotos'?'bc-choice bc-handle-choice':'bc-choice')+' cursor-interaction');
            b.type='button';b.dataset.axis=axis.key;b.dataset.value=value;b.setAttribute('aria-pressed','false');
            if(axis.kind==='finishphotos'){const img=node('img','bc-finish-photo');img.src=finishImages[value];img.alt=displayValue(axis,value)+' · structuurvoorbeeld in RVS-kleur';img.width=200;img.height=187;b.append(img,node('span',null,displayValue(axis,value)));}
            else if(axis.kind==='productphotos'){const img=node('img');img.width=160;img.height=120;b.previewImage=img;b.previewMissing=node('span','bc-photo-missing','Afbeelding volgt');b.previewCaption=node('span',null,displayValue(axis,value));b.append(img,b.previewMissing,b.previewCaption);}
            else if(axis.kind==='handlephotos'){const img=node('img');img.src=handleImages[value];img.alt='';img.width=72;img.height=72;b.append(img,node('span',null,value));}
            else if(dropdown){const img=node('img');img.src=textures[value];img.alt='';img.width=36;img.height=36;b.append(img,node('span',null,value));}
            else if(swatch){
              const chip=node('span','bc-chip'),surface=node('span','bc-chip-surface');
              if(['texture','decorchips'].includes(axis.kind)&&textures[value]){const img=node('img');img.src=textures[value];img.alt='';img.width=42;img.height=42;surface.append(img);}
              else surface.style.setProperty('--sample',metals[value]);
              chip.append(surface,node('span','bc-check','✓'));chip.lastChild.setAttribute('aria-hidden','true');const name=node('span','bc-swatch-name',axis.kind==='metal'?colourLabels[value]:value);
              if(axis.key==='colour'&&axis.kind!=='decorchips'){
                b.className+=' bc-product-colour';b.colourImage=node('img','bc-colour-photo');b.colourImage.width=72;b.colourImage.height=72;b.colourImage.alt='';
                b.colourFallback=chip;b.colourMissing=node('span','bc-colour-missing','Productfoto volgt');b.append(b.colourImage,chip,name,b.colourMissing);
              }else b.append(chip,name);
            }else if(axis.kind==='plans'){
              b.append(plan(value),node('span','bc-plan-name',value==='Zonder zijwand'?'Rechte wand':'Met zijwand'),node('span','bc-plan-detail',value==='Zonder zijwand'?'Zonder zijwand':value.startsWith('30')?'Maat 30 cm':'Maat 40 cm'));
              b.setAttribute('aria-label',value);
            }else b.textContent=displayValue(axis,value);
            b.addEventListener('click',()=>{if(choose(axis.key,value)&&dropdown){dropdown.open=false;summary.focus();}});
            list.append(b);entries.push({button:b,value});
          }
          let toggle=null,count=null,toggleLabel=null;
          if(swatch&&axis.values.length>6){
            list.id='brauer-simpler-'+family.id+'-'+axis.key;
            toggle=node('button','bc-toggle cursor-interaction');toggle.type='button';toggle.setAttribute('aria-controls',list.id);toggleLabel=node('span');count=node('span','bc-count','+'+(axis.values.length-6));toggle.append(toggleLabel,count);
            const token=family.id+':'+axis.key;
            toggle.addEventListener('click',()=>{if(expanded.has(token))expanded.delete(token);else expanded.add(token);update();});group.append(toggle);
          }
          if(axis.kind==='handlephotos')group.append(node('p','bc-small','Hendelvormen afgebeeld in chroom; de kleur kies je hierboven.'));

          if(axis.kind==='dropdown')group.append(node('p','bc-small','15 decors · bekijk de staal naast iedere naam.'));
          if(axis.kind==='plans')group.append(node('p','bc-small','Bovenaanzicht · muur bovenaan · schematisch, niet op schaal.'));

          holder.append(group);controls.push({axis,group,chosen,entries,toggle,count,toggleLabel,dropdown,summary,currentImage,currentName});
        }
        if(family.kind==='cabinet'){
          const group=node('section','bc-group bc-drain');
          group.append(node('div','bc-label','Afstemmen op je wastafel'));
          const details=node('details','bc-drain-details'),summary=node('summary','cursor-interaction','Kies de afvoerindeling');
          details.append(summary,node('p','bc-small','Voor dit meubel bestaan twee uitvoeringen. De uitsparingen maken ruimte voor de sifon in de lade. Controleer welke indeling bij je wastafel past.'));
          const list=node('div','bc-values'),entries=[];list.setAttribute('role','group');list.setAttribute('aria-label','Afvoeruitsparingen');
          for(const value of ['1','2']){const b=node('button','bc-choice cursor-interaction',value==='1'?'1 uitsparing':'2 uitsparingen');b.type='button';b.addEventListener('click',()=>chooseDrain(value));list.append(b);entries.push({button:b,value});}
          details.append(list);group.append(details);holder.append(group);drain={group,details,summary,entries};
        }
        update();
      }
      function update(){
        const options=currentOptions(),matches=usesState()?cabinetMatches():[],product=usesState()?cabinetProduct():selected.get(family.id),reference=product||matches[0];
        if(usesState())selected.set(family.id,product);
        root.querySelector('[data-field="title"]').textContent=reference.title;
        root.querySelector('[data-field="sku"]').textContent=product?product.sku:(family.kind==='conditional'?'Kies de draairichting':'Kies eerst de afvoerindeling');
        root.querySelector('[data-field="description"]').textContent=family.kind==='cabinet'?family.cabinetDescription.replace('{drawers}',options.drawers.replace('lades','softclose lades')):reference.description;
        root.querySelector('[data-field="price"]').textContent=product?money.format(product.price):'Vanaf '+money.format(Math.min(...matches.map(p=>p.price)));
        const photo=root.querySelector('[data-product-photo]'),mainImage=root.querySelector('[data-product-photo-image]');
        const mainAsset=firstLinkedProductImage(product,linkedProducts),mainSrc=mainAsset&&mainAsset.src;
        photo.hidden=!family.photoBacked&&!mainSrc;mainImage.hidden=!mainSrc;mainImage.src=mainSrc||'';root.querySelector('[data-product-photo-missing]').hidden=Boolean(mainSrc);root.querySelector('[data-product-photo-missing]').textContent=product?'Afbeelding volgt':family.kind==='conditional'?'Kies de draairichting':'Kies de afvoerindeling';mainImage.alt=product?product.title+' ('+product.sku+')':'';mainImage.setAttribute('data-photo-sku',mainSrc?product.sku:'');
        root.querySelector('[data-field="note"]').textContent=family.note;
        root.querySelector('[data-field="help"]').textContent=family.help;
        root.querySelector('[data-field="future"]').textContent=reference.future?'Volgens de prijslijst beschikbaar vanaf 1 februari 2027.':'';
        for(const item of controls){
          const {axis,group,chosen,entries,toggle,count,toggleLabel,dropdown,currentImage,currentName,select}=item;
          group.hidden=!axisActive(axis,options,family);
          chosen.textContent=options[axis.key]==null?'Kies links of rechts':displayValue(axis,options[axis.key]);chosen.hidden=Boolean(dropdown||select);
          const visible=axis.values.slice(0,6);if(!visible.includes(options[axis.key])){visible.pop();visible.push(options[axis.key]);}
          const open=expanded.has(family.id+':'+axis.key);
          for(const {button,value} of entries){button.disabled=!candidate(axis.key,value);
            if(button.colourImage){
              const optionTarget=candidate(axis.key,value),target=usesState()?resolvedChoice(family,{...cabinetState,[axis.key]:value}):optionTarget,image=firstLinkedProductImage(target,linkedProducts);
              button.colourImage.hidden=!image;button.colourFallback.hidden=Boolean(image);button.colourMissing.hidden=Boolean(image);
              button.colourImage.src=image?image.src:'';button.colourImage.alt=target?target.title+' ('+target.sku+')':'';
              button.colourImage.setAttribute('data-colour-sku',target?target.sku:'');
              button.colourMissing.textContent=!optionTarget?'Niet combineerbaar':!target?(family.kind==='conditional'?'Kies de draairichting':'Kies afvoerindeling'):'Productfoto volgt';
            }if(button.previewImage){const next=usesState()?resolvedChoice(family,{...cabinetState,[axis.key]:value}):candidate(axis.key,value);const image=firstLinkedProductImage(next,linkedProducts),src=image&&image.src;button.previewImage.hidden=!src;button.previewMissing.hidden=Boolean(src);button.previewImage.src=src||'';button.previewImage.alt=next?next.title+' ('+next.sku+')':'';button.previewImage.setAttribute('data-preview-sku',next?next.sku:'');button.previewCaption.textContent=displayValue(axis,value);}if(select)button.selected=value===options[axis.key];else button.setAttribute('aria-pressed',String(value===options[axis.key]));button.hidden=Boolean(toggle)&&!open&&!visible.includes(value);}
          if(select)select.value=options[axis.key];
          if(toggle){toggle.setAttribute('aria-expanded',String(open));toggleLabel.textContent=open?'Minder kleuren':'Bekijk meer kleuren';count.hidden=open;}
          if(dropdown){currentImage.src=textures[options[axis.key]];currentName.textContent=options[axis.key];}
        }
        if(drain){
          drain.group.hidden=matches.length<2;
          drain.summary.textContent=product?'Afvoerindeling: '+product.options.cutouts+(product.options.cutouts==='1'?' uitsparing':' uitsparingen'):'Kies de afvoerindeling';
          for(const e of drain.entries){e.button.disabled=!matches.some(p=>p.options.cutouts===e.value);e.button.setAttribute('aria-pressed',String(Boolean(product)&&product.options.cutouts===e.value));}
        }
        examplePicker.value=family.id;
        nav.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.example===family.id)));
        const list=root.querySelector('[data-specs]');list.replaceChildren();
        let specs=reference.specs;
        if(family.kind==='cabinet'&&!product)specs=specs.filter(([label])=>label!=='Sifonuitsparingen');
        if(family.kind==='conditional'&&!product)specs=specs.map(([label,value])=>[label,label==='Draairichting deur'?'Nog te kiezen':value]);
        for(const [label,value] of [['Artikelnummer',product?product.sku:'Nog te kiezen'],['EAN',product?product.ean:'Nog te kiezen'],...specs])list.append(node('dt',null,label),node('dd',null,value));
      }
      nav.forEach(b=>b.addEventListener('click',()=>{const next=families.find(f=>f.id===b.dataset.example);if(next){family=next;if(usesState())cabinetState=cabinetStates.get(family.id);build();}}));
      examplePicker.addEventListener('change',()=>{const next=families.find(f=>f.id===examplePicker.value);if(next){family=next;if(usesState())cabinetState=cabinetStates.get(family.id);build();}});
      root.addEventListener('brauer:product-images',event=>{const d=event.detail||{};if(replaceLinkedProductImages(linkedProducts,d.productId,d.sku,d.images))update();});
      root.addEventListener('keydown',event=>{if(event.key==='Escape')closeDecors(true);});
      document.addEventListener('click',event=>{for(const c of controls)if(c.dropdown&&c.dropdown.open&&!c.dropdown.contains(event.target))c.dropdown.open=false;});
      build();
    })();
